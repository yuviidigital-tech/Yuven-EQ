name: Build Yuven EQ APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Unpack Yuven EQ source
        run: |
          rm -rf source
          mkdir source
          unzip -q Yuven_EQ_V1_SourceForGitHub.zip -d source

      - name: Build debug APK
        working-directory: source/Yuven_EQ_V1
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp source/Yuven_EQ_V1/app/build/outputs/apk/debug/app-debug.apk dist/Yuven-EQ-V1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yuven-EQ-V1-APK
          path: dist/Yuven-EQ-V1-debug.apk
          if-no-files-found: error
